      additionalProperties: false
      required:
      - x
      - y
      - width
      - height
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1
    TextRange:
      type: object
      additionalProperties: false
      required:
      - startItemId
      - startOffset
      - endItemId
      - endOffset
      properties:
        startItemId:
          type: string
          maxLength: 160
        startOffset:
          type: integer
          minimum: 0
        endItemId:
          type: string
          maxLength: 160
        endOffset:
          type: integer
          minimum: 0
    SelectionAnchor:
      type: object
      additionalProperties: false
      required:
      - documentId
      - documentVersionId
      - pageNumber
      - rects
      properties:
        documentId:
          type: string
          format: uuid
        documentVersionId:
          type: string
          format: uuid
        pageNumber:
          type: integer
          minimum: 1
        rects:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/NormRect'
        textRange:
          $ref: '#/components/schemas/TextRange'
        selectedText:
          type: string
          maxLength: 12000
        blockIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
    PdfBlock:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - readingOrder
      - bounds
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - heading
          - paragraph
          - caption
          - list
          - table
          - figure
          - equation
          - reference
          - header
          - footer
          - other
        readingOrder:
          type: integer
          minimum: 0
        text:
          type:
          - string
          - 'null'
        bounds:
          $ref: '#/components/schemas/NormRect'
        quads:
          type: array
          items:
            $ref: '#/components/schemas/NormRect'
        captionBlockId:
          type:
          - string
          - 'null'
          format: uuid
        sectionPath:
          type: array
          items:
