      security: *id001
components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: paperbridge_session
      description: HttpOnly cookie. Name is configurable; clients must not read it.
    desktopBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
      description: Held by Electron main process and injected through the local bridge.
  responses:
    BadRequest: &id015
      description: RFC 9457 style problem details. `code` is the stable application identifier.
      content: &id016
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized: *id015
    Forbidden: *id015
    NotFound: *id015
    Conflict: *id015
    Unprocessable: *id015
    RateLimited:
      description: RFC 9457 style problem details. `code` is the stable application identifier.
      content: *id016
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
    InternalError: *id015
    ServiceUnavailable: *id015
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
      - name
      - status
      - buildSha
      - contractVersion
      properties:
        name:
          const: PaperBridge API
        status:
          type: string
          enum:
          - ok
          - degraded
        buildSha:
          type: string
        contractVersion:
          type: string
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum:
            - ok
            - degraded
            - unavailable
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 500
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,99}$
        requestId:
          type: string
          maxLength: 100
        retryable:
          type: boolean
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - code
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
        meta:
          type: object
          additionalProperties: true
    AuthCredentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - password
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
    Profile:
      type: object
      additionalProperties: false
      required:
      - userId
      - displayName
      - locale
      - timezone
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 120
        locale:
          type: string
          maxLength: 20
        timezone:
          type: string
          maxLength: 64
    Session:
      type: object
      additionalProperties: false
      required:
      - authenticated
      - authMethod
      properties:
        authenticated:
          type: boolean
        authMethod:
          type: string
          enum:
          - anonymous
          - web-cookie
          - desktop-bearer
        profile:
          $ref: '#/components/schemas/Profile'
        defaultWorkspaceId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        deviceId:
          type: string
          format: uuid
    Capabilities:
      type: object
      additionalProperties: false
      required:
      - runtime
      - features
      properties:
        runtime:
          type: string
          enum:
          - web
          - desktop
        features:
          type: object
          additionalProperties:
            type: boolean
        limits:
          type: object
          additionalProperties:
            type:
            - integer
            - number
            - string
            - boolean
    DesktopAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - codeChallenge
      - codeChallengeMethod
      - redirectUri
      - state
      - installation
      properties:
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 128
        codeChallengeMethod:
          const: S256
        redirectUri:
          type: string
          pattern: ^http://127\.0\.0\.1:[0-9]{1,5}/callback$
        state:
          type: string
          minLength: 16
          maxLength: 200
        installation:
          type: object
          additionalProperties: false
          required:
          - publicId
          - platform
          - architecture
          - appVersion
          properties:
            publicId:
              type: string
              format: uuid
            platform:
              const: macos
            architecture:
              type: string
              enum:
              - arm64
              - x64
            appVersion:
              type: string
              maxLength: 40
            devicePublicKey:
              type: string
              contentEncoding: base64
    DesktopAuthorization:
      type: object
      additionalProperties: false
      required:
      - authorizationId
      - loginUrl
      - expiresAt
      properties:
        authorizationId:
          type: string
          format: uuid
        loginUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    DesktopTokenRequest:
      type: object
      additionalProperties: false
      required:
      - authorizationId
      - code
      - codeVerifier
      properties:
        authorizationId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 16
          maxLength: 300
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          writeOnly: true
    DesktopTokenResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - deviceId
      properties:
        accessToken:
          type: string
          writeOnly: true
        refreshToken:
          type: string
          writeOnly: true
        tokenType:
          const: Bearer
        expiresIn:
          type: integer
          minimum: 60
        deviceId:
          type: string
          format: uuid
    DeviceSession:
      type: object
      additionalProperties: false
      required:
      - id
      - platform
      - architecture
      - appVersion
      - createdAt
      - lastSeenAt
      - revoked
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
        architecture:
          type: string
        appVersion:
          type: string
        channel:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        revoked:
          type: boolean
    WorkspaceRole:
      type: string
      enum:
      - owner
      - admin
      - member
      - viewer
    Workspace:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - role
      - planCode
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - personal
          - lab
        name:
          type: string
          maxLength: 160
        slug:
          type:
          - string
          - 'null'
          maxLength: 100
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        planCode:
          type: string
          maxLength: 64
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspacePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        nextCursor:
          type:
          - string
          - 'null'
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          enum:
          - lab
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{2,99}$
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type:
          - string
          - 'null'
          pattern: ^[a-z0-9][a-z0-9-]{2,99}$
    WorkspaceMember:
      type: object
      additionalProperties: false
      required:
      - userId
      - displayName
      - role
      - status
      - version
      - createdAt
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        status:
          type: string
          enum:
          - invited
          - active
          - suspended
          - removed
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        joinedAt:
          type:
          - string
          - 'null'
          format: date-time
    WorkspaceMemberPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
        nextCursor:
          type:
          - string
          - 'null'
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
          - viewer
    WorkspaceInvitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - role
      - status
      - expiresAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        status:
          type: string
          enum:
          - pending
          - accepted
          - expired
          - revoked
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          type: string
          enum:
          - admin
          - member
          - viewer
        status:
          type: string
          enum:
          - active
          - suspended
    DocumentStatus:
      type: string
      enum:
      - pending_upload
      - queued
      - extracting
      - structuring
      - indexing
      - ready
      - failed
      - deleting
      - deleted
    Document:
      type: object
      additionalProperties: false
      required:
      - id
      - workspaceId
      - title
      - originalFilename
      - mimeType
      - byteSize
      - status
      - fileReady
      - analysisReady
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 500
        originalFilename:
          type: string
          maxLength: 500
        mimeType:
          const: application/pdf
        byteSize:
          type: integer
          minimum: 1
          maximum: 52428800
        pageCount:
          type:
          - integer
          - 'null'
          minimum: 1
        sourceSha256:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileReady:
          type: boolean
        analysisReady:
          type: boolean
        failure:
          oneOf:
          - $ref: '#/components/schemas/DocumentFailure'
          - type: 'null'
        currentVersionId:
          type:
          - string
          - 'null'
          format: uuid
        currentParseVersion:
          type:
          - integer
          - 'null'
          minimum: 1
        highlightCount:
          type: integer
          minimum: 0
          default: 0
        lastOpenedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentFailure:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      - failedAt
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        failedAt:
          type: string
          format: date-time
    DocumentPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        nextCursor:
          type:
          - string
          - 'null'
    CreateDocumentUploadRequest:
      type: object
      additionalProperties: false
      required:
      - workspaceId
      - originalFilename
      - contentType
      - byteSize
      properties:
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 500
        originalFilename:
          type: string
          minLength: 1
          maxLength: 500
        contentType:
          const: application/pdf
        byteSize:
          type: integer
          minimum: 1
          maximum: 52428800
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    DocumentUpload:
      type: object
      additionalProperties: false
      required:
      - id
      - documentId
      - method
      - uploadUrl
      - requiredHeaders
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - PUT
          - POST
        uploadUrl:
          type: string
          format: uri
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxBytes:
          type: integer
    CompleteDocumentUploadRequest:
      type: object
      additionalProperties: false
      properties:
        etag:
          type: string
          maxLength: 300
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    UpdateDocumentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        lastOpenedAt:
          type: string
          format: date-time
    FileAccess:
      type: object
      additionalProperties: false
      required:
      - url
      - expiresAt
      - contentType
      - byteSize
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        contentType:
          const: application/pdf
        byteSize:
          type: integer
        sha256:
          type:
          - string
          - 'null'
    CreateParseJobRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - initial
          - retry
          - reparse
          - parser_upgrade
          default: retry
        forceParserVersion:
          type: string
          maxLength: 80
    ParseJob:
      type: object
      additionalProperties: false
      required:
      - id
      - documentId
      - parseVersion
      - status
      - attempt
      - queuedAt
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        parseVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        attempt:
          type: integer
          minimum: 1
        progressBps:
          type: integer
          minimum: 0
          maximum: 10000
        errorCode:
          type:
          - string
          - 'null'
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
    ObjectGraphAccess:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - parserVersion
      - url
      - expiresAt
      - contentEncoding
      properties:
        schemaVersion:
          type: string
        parserVersion:
          type: string
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        contentEncoding:
          type: string
          enum:
          - identity
          - gzip
          - zstd
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    NormRect:
